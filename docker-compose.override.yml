version: '3.4'
services:
  netbox:
    container_name: netbox
    ports:
    - 8080:8080
    network_mode: bridge
    volumes:
    - /mnt/dock-nb_conf:/etc/netbox/config:z,ro
    - /mnt/dock-nb_media:/opt/netbox/netbox/media:z,rw
    - /mnt/dock-nb_reports:/opt/netbox/netbox/reports:z,rw
    - /mnt/dock-nb_scripts:/opt/netbox/netbox/scripts:z,rw
    healthcheck:
      retries: 15
  netbox-worker:
    container_name: netbox-worker
    volumes:
    - /mnt/dock-nb_conf:/etc/netbox/config:z,ro
    - /mnt/dock-nb_media:/opt/netbox/netbox/media:z,rw
    - /mnt/dock-nb_reports:/opt/netbox/netbox/reports:z,rw
    - /mnt/dock-nb_scripts:/opt/netbox/netbox/scripts:z,rw
  netbox-housekeeping:
    container_name: netbox-housekeeping
    volumes:
    - /mnt/dock-nb_conf:/etc/netbox/config:z,ro
    - /mnt/dock-nb_media:/opt/netbox/netbox/media:z,rw
    - /mnt/dock-nb_reports:/opt/netbox/netbox/reports:z,rw
    - /mnt/dock-nb_scripts:/opt/netbox/netbox/scripts:z,rw
